# Pin the toolchain so CI is reproducible.
#
# Without this, actions-rust-lang/setup-rust-toolchain resolves "stable" at run
# time, so a new Rust release can turn CI red with no code change -- which is
# exactly what happened when 1.98.0 (2026-08-18) introduced new clippy lints.
# Bump this deliberately, and fix any new lints in the same PR.
[toolchain]
channel = "1.98.0"
components = ["rustfmt", "clippy"]
